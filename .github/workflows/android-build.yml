name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest --stacktrace > gradle-test.log 2>&1
          result=$?
          cat gradle-test.log
          if [[ $result -ne 0 ]]; then
            detail="$(grep -E '(^e: |error:|FAILED|What went wrong|Execution failed|AssertionError|expected:|Tests run:)' gradle-test.log | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Gradle unit tests failed::${detail:-See Gradle test output above}"
          fi
          exit "$result"

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace > gradle-apk.log 2>&1
          result=$?
          cat gradle-apk.log
          if [[ $result -ne 0 ]]; then
            detail="$(grep -E '(^e: |error:|FAILED|What went wrong|Execution failed)' gradle-apk.log | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Debug APK build failed::${detail:-See Gradle build output above}"
          fi
          exit "$result"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
